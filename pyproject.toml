[project]
name = "qmd-vl"
version = "0.1.0"
description = "Vision-Language Memory Search System with LanceDB"
requires-python = ">=3.12"
dependencies = [
    "lancedb>=0.15.0",
    "pyarrow>=15.0.0",
    "pillow>=10.0.0",
    "numpy>=1.26.0",
    "mcp>=1.0.0",
    "qwen-vl-utils>=0.0.1",
    "transformers>=4.40.0",
    "accelerate>=0.28.0",
    "torch>=2.2.0",
    "tantivy>=0.21.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]