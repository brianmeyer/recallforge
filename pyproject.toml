[project]
name = "qmd-vl"
version = "0.1.0"
description = "QMD Vision-Language Memory Search System"
requires-python = ">=3.12"
dependencies = [
    "lancedb>=0.20",
    "pyarrow>=18.0",
    "pillow>=10.0",
    "numpy>=2.0",
    "mcp>=1.0",
    "qwen-vl-utils>=0.0.14",
    "transformers>=4.40",
    "torch>=2.0",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]